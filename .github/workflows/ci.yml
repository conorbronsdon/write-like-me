name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - name: Validate SKILL.md frontmatter
        run: |
          git clone --depth 1 https://github.com/conorbronsdon/agent-skill-builder /tmp/asb
          python /tmp/asb/scripts/validate_skill.py --profile agentskills .
