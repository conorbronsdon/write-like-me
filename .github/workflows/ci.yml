name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        include:
          # ubuntu-latest has no Python 3.9 build; 22.04 still does.
          - python-version: "3.9"
            os: ubuntu-22.04
          - python-version: "3.13"
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - name: Validate SKILL.md frontmatter
        run: |
          git clone --depth 1 https://github.com/conorbronsdon/agent-skill-builder /tmp/asb
          python /tmp/asb/scripts/validate_skill.py --profile agentskills .
